<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1f3a5f" />
    <title>ページが見つかりません｜はじめてのClaude 教室</title>
    <link rel="icon" href="/miyata-claude-classroom/img/logo.png" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f7f9;
        color: #1b2333;
        font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      }
      main {
        max-width: 420px;
        margin: 16px;
        padding: 32px;
        background: #fff;
        border: 1px solid #e3e7ee;
        border-radius: 8px;
        text-align: center;
      }
      h1 { font-size: 22px; margin: 0 0 12px; }
      p { color: #5b6577; line-height: 1.8; margin: 0 0 24px; }
      a {
        display: inline-block;
        padding: 12px 24px;
        background: #1f3a5f;
        color: #fff;
        border-radius: 6px;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ページが見つかりません</h1>
      <p>アドレスが違うか、古いリンクです。教室のホームから選び直してください。</p>
      <a id="home" href="/miyata-claude-classroom/">教室のホームへ</a>
    </main>
    <script>
      // GitHub Pages では /リポジトリ名/ が教室のトップ
      const seg = location.pathname.split("/")[1];
      const root = location.hostname.endsWith("github.io") && seg ? `/${seg}/` : "/";
      document.getElementById("home").href = root;
      setTimeout(() => location.replace(root), 2500);
    </script>
  </body>
</html>
